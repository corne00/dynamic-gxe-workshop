project:
  type: website
  output-dir: docs
  resources:
    - js
  render:
    - index.qmd
    - setup.qmd
    - 01-method.qmd
    - 02-data.qmd
    - 03-design.qmd
    - 04-fitting.qmd
    - 05-validate.qmd
    - 06-reading.qmd
    - 07-genotypes.qmd
    - 08-build.qmd
    - reference.qmd

execute:
  freeze: auto
  echo: true
  warning: false
  message: false

website:
  title: "Sparse identification of crop growth"
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: false
  repo-url: https://github.com/corne00/dynamic-gxe-workshop
  repo-actions: [source]
  sidebar:
    style: docked
    search: false
    footer: |
      <div class="code-switch" role="group" aria-label="Show code">
        <span>Code</span>
        <button type="button" data-mode="off">Off</button>
        <button type="button" data-mode="R">R</button>
        <button type="button" data-mode="Python">Python</button>
      </div>
      <div class="sidebar-logos">
        <img src="images/logo_aagi.png" alt="AAGI, Analytics for the Australian Grains Industry" class="logo-aagi">
        <img src="images/logo_tudelft.png" alt="TU Delft" class="logo-tudelft">
        <img src="images/logo_cropxr.png" alt="CropXR" class="logo-cropxr">
      </div>
    contents:
      - text: "Overview"
        href: index.qmd
      - text: "Set up"
        href: setup.qmd
      - section: "Steps"
        contents:
          - text: "1 · Method"
            href: 01-method.qmd
          - text: "2 · Data"
            href: 02-data.qmd
          - text: "3 · Library and design matrix"
            href: 03-design.qmd
          - text: "4 · Fitting"
            href: 04-fitting.qmd
          - text: "5 · Validation"
            href: 05-validate.qmd
          - text: "6 · Interpretation"
            href: 06-reading.qmd
          - text: "7 · Genotypes"
            href: 07-genotypes.qmd
          - text: "8 · Build your own"
            href: 08-build.qmd
      - text: "Reference"
        href: reference.qmd
  page-footer:
    left: "AAGI Symposium 2026"
    right: "C. Verburg · TU Delft · CropXR [![QR code to the workshop website](images/qr.svg){.footer-qr}](https://corne00.github.io/dynamic-gxe-workshop/)"

format:
  html:
    theme: theme.scss
    css: styles.css
    toc: true
    toc-title: "On this page"
    toc-depth: 2
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    fig-dpi: 144
    fig-width: 7.2
    fig-height: 3.8
    fig-align: center
    smooth-scroll: true
    include-in-header:
      text: |
        <script src="js/d3.min.js?v=7"></script>
        <script src="js/plot.umd.min.js?v=06"></script>
        <script data-goatcounter="https://corne00.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
        <script src="js/codetoggle.js?v=1"></script>
        <script src="js/controls.js?v=20261109a"></script>
        <script src="js/builder.js?v=20261109a"></script>
        <script src="js/equation.js?v=20261109a"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
